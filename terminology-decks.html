<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminology Decks | Eric J's Field Notes</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --deck-bg: #f3f1ec;
    --card-front: #a16207;
    --card-front-dark: #7a4a05;
    --card-back: #06402b;
    --card-back-dark: #042e1f;
    --accent: #a16207;
    --accent-dark: #7a4a05;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --correct: #06402b;
    --wrong: #ef4444;
    --review: #b45309;
    --shuffle: #06402b;
    --reset: #57534e;
    --breakdown-text: #fde68a;
    --border-soft: #d6d3d1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header.term-header {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  header.term-header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent);
  }

  header.term-header a.back-home-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    transition: all 0.15s ease;
  }

  header.term-header a.back-home-link:hover {
    background: var(--accent);
    color: #ffffff;
    transform: translateY(-1px);
  }

  .deck-selector {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .deck-tab {
    flex: 1;
    min-width: 120px;
    padding: 10px 16px;
    background: var(--deck-bg);
    color: var(--muted);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    position: relative;
  }

  .deck-tab:hover { color: var(--text); border-color: var(--accent); }
  .deck-tab.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .deck-tab .tab-badge {
    display: inline-block;
    background: var(--review);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .deck-tab.active .tab-badge {
    background: rgba(255, 255, 255, 0.3);
  }

  .term-progress-bar {
    width: 100%;
    max-width: 720px;
    height: 6px;
    background: var(--deck-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .term-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--correct));
    width: 0%;
    transition: width 0.3s ease;
  }

  .term-meta {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .term-card-container {
    perspective: 1200px;
    width: 100%;
    max-width: 720px;
    height: 400px;
    margin-bottom: 24px;
    cursor: pointer;
  }

  .term-card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .term-card.flipped { transform: rotateY(180deg); }

  .term-card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    color: #ffffff;
  }

  .term-card-front {
    background: linear-gradient(135deg, var(--card-front), var(--card-front-dark));
  }

  .term-card-back {
    background: linear-gradient(135deg, var(--card-back), var(--card-back-dark));
    transform: rotateY(180deg);
  }

  .term-card-review-badge {
    position: absolute;
    top: 16px;
    right: 20px;
    background: var(--review);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .term-card-label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.8;
  }

  .term-card-term {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .term-card-sub {
    font-size: 0.95rem;
    opacity: 0.9;
    margin-top: 8px;
    font-style: italic;
  }

  .term-card-def {
    font-size: 1.35rem;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .term-card-breakdown {
    font-size: 0.95rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 12px 18px;
    border-radius: 10px;
    margin-top: 8px;
    line-height: 1.6;
    text-align: left;
    max-width: 90%;
  }

  .term-card-breakdown span { color: var(--breakdown-text); font-weight: 700; }

  .term-hint {
    position: absolute;
    bottom: 16px;
    font-size: 0.75rem;
    opacity: 0.7;
    letter-spacing: 0.5px;
  }

  .term-controls {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .term-controls button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    color: white;
  }

  .term-controls button:hover { transform: translateY(-1px); opacity: 0.92; }
  .term-controls button:active { transform: translateY(0); }
  .term-controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-nav { background: var(--reset); }
  .btn-know { background: var(--correct); }
  .btn-review { background: var(--review); }
  .btn-shuffle { background: var(--shuffle); }
  .btn-reset { background: var(--reset); }

  .term-stats {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-around;
    background: var(--deck-bg);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 16px;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }

  .term-stat { text-align: center; }
  .term-stat .num { font-size: 1.4rem; font-weight: 700; display: block; }
  .term-stat .lbl { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

  .term-stat.known .num { color: var(--correct); }
  .term-stat.review .num { color: var(--review); }

  .term-secondary-controls {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .term-secondary-controls button {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .term-secondary-controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .completion-screen {
    width: 100%;
    max-width: 720px;
    background: linear-gradient(135deg, var(--card-back), var(--card-back-dark));
    color: #ffffff;
    border-radius: 16px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    display: none;
    margin-bottom: 24px;
  }

  .completion-screen.visible { display: block; }

  .completion-screen .emoji { font-size: 4rem; margin-bottom: 16px; }
  .completion-screen h2 { font-size: 1.75rem; margin-bottom: 12px; }
  .completion-screen p { font-size: 1rem; opacity: 0.9; margin-bottom: 24px; line-height: 1.6; }

  .completion-screen button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #ffffff;
    cursor: pointer;
    margin: 4px;
    transition: all 0.15s ease;
  }

  .completion-screen button:hover { transform: translateY(-1px); opacity: 0.92; }

  .deck-finished .term-card-container,
  .deck-finished .term-controls,
  .deck-finished .term-progress-bar,
  .deck-finished .term-meta { display: none; }

  @media (max-width: 600px) {
    .term-card-term { font-size: 1.5rem; }
    .term-card-def { font-size: 1.1rem; }
    .term-card-container { height: 360px; }
    .term-card-face { padding: 28px 20px; }
    .deck-tab { font-size: 0.75rem; padding: 8px 10px; }
  }
</style>
</head>
<body>

<header class="term-header">
  <h1>📚 Terminology Decks</h1>
  <a href="index.html" class="back-home-link">
    <span class="material-icons" style="font-size: 1rem; vertical-align: middle;">arrow_back</span>
    Back to Home
  </a>
</header>

<div class="deck-selector" id="deckSelector">
  <button class="deck-tab active" data-deck="all">All Terms</button>
  <button class="deck-tab" data-deck="prefix">Prefixes</button>
  <button class="deck-tab" data-deck="suffix">Suffixes</button>
  <button class="deck-tab" data-deck="root">Root Words</button>
</div>

<div class="term-progress-bar"><div class="term-progress-fill" id="termProgressFill"></div></div>
<div class="term-meta">
  <span id="termCardCounter">Card 1 of 1</span>
  <span id="termDeckLabel">All Terms</span>
</div>

<div class="completion-screen" id="completionScreen">
  <div class="emoji">🎉</div>
  <h2>Deck Complete!</h2>
  <p id="completionMessage">You've mastered every card in this deck.</p>
  <button id="resetFromCompleteBtn">↻ Start Over</button>
  <button id="reviewMissedFromCompleteBtn" style="background: var(--review);">📚 Review Still Learning</button>
</div>

<div class="term-card-container" id="termCardContainer">
  <div class="term-card" id="termCard">
    <div class="term-card-face term-card-front">
      <div class="term-card-label">Term</div>
      <div class="term-card-review-badge" id="cardReviewBadge" style="display: none;">Still Learning</div>
      <div class="term-card-term" id="termText">—</div>
      <div class="term-card-sub" id="termSub"></div>
      <div class="term-hint">Tap card to flip</div>
    </div>
    <div class="term-card-face term-card-back">
      <div class="term-card-label">Meaning</div>
      <div class="term-card-def" id="termDef">—</div>
      <div class="term-card-breakdown" id="termBreakdown"></div>
      <div class="term-hint">Tap card to flip</div>
    </div>
  </div>
</div>

<div class="term-controls">
  <button class="btn-nav" id="termPrevBtn">◀ Prev</button>
  <button class="btn-review" id="termReviewBtn">Still Learning</button>
  <button class="btn-know" id="termKnowBtn">Got It ✓</button>
  <button class="btn-nav" id="termNextBtn">Next ▶</button>
</div>

<div class="term-controls">
  <button class="btn-shuffle" id="termShuffleBtn">🔀 Shuffle</button>
  <button class="btn-reset" id="termResetBtn">↻ Reset Deck</button>
</div>

<div class="term-secondary-controls">
  <button id="reviewOnlyBtn">📚 Review Only (Still Learning)</button>
  <button id="clearProgressBtn">🗑️ Clear All Progress</button>
</div>

<div class="term-stats">
  <div class="term-stat known">
    <span class="num" id="termKnownCount">0</span>
    <span class="lbl">Known</span>
  </div>
  <div class="term-stat review">
    <span class="num" id="termReviewCount">0</span>
    <span class="lbl">Still Learning</span>
  </div>
  <div class="term-stat">
    <span class="num" id="termRemainingCount">0</span>
    <span class="lbl">In Deck</span>
  </div>
</div>

<script>
/* ============================================================
   TERMINOLOGY DECKS DATA
   Cleaned up: no duplicates, correct category assignments
   Categories: "prefix", "suffix", "root"
   ============================================================ */
const TERM_DECKS = [

  /* ============================================================
     PREFIXES (25 cards)
     ============================================================ */
  { cat: "prefix", term: "Bradycardia", sub: "Prefix + Root + Suffix",
    def: "Abnormally slow heart rate (typically under 60 bpm).",
    breakdown: "<span>brady-</span> = slow • <span>cardi</span> = heart • <span>-ia</span> = condition" },
  { cat: "prefix", term: "Tachycardia", sub: "Prefix + Root + Suffix",
    def: "Abnormally fast heart rate (typically over 100 bpm).",
    breakdown: "<span>tachy-</span> = fast • <span>cardi</span> = heart • <span>-ia</span> = condition" },
  { cat: "prefix", term: "Hypertension", sub: "Prefix + Root + Suffix",
    def: "High blood pressure.",
    breakdown: "<span>hyper-</span> = high • <span>tens</span> = pressure • <span>-ion</span> = process" },
  { cat: "prefix", term: "Hypoglycemia", sub: "Prefix + Root + Suffix",
    def: "Low blood sugar.",
    breakdown: "<span>hypo-</span> = low • <span>glyc</span> = sugar • <span>-emia</span> = blood condition" },
  { cat: "prefix", term: "Hyperglycemia", sub: "Prefix + Root + Suffix",
    def: "High blood sugar.",
    breakdown: "<span>hyper-</span> = high • <span>glyc</span> = sugar • <span>-emia</span> = blood condition" },
  { cat: "prefix", term: "Dyspnea", sub: "Prefix + Suffix",
    def: "Difficulty breathing or shortness of breath.",
    breakdown: "<span>dys-</span> = difficult • <span>-pnea</span> = breathing" },
  { cat: "prefix", term: "Apnea", sub: "Prefix + Suffix",
    def: "Absence of breathing.",
    breakdown: "<span>a-</span> = without • <span>-pnea</span> = breathing" },
  { cat: "prefix", term: "Tachypnea", sub: "Prefix + Suffix",
    def: "Abnormally rapid breathing.",
    breakdown: "<span>tachy-</span> = fast • <span>-pnea</span> = breathing" },
  { cat: "prefix", term: "Bradypnea", sub: "Prefix + Suffix",
    def: "Abnormally slow breathing.",
    breakdown: "<span>brady-</span> = slow • <span>-pnea</span> = breathing" },
  { cat: "prefix", term: "Aphasia", sub: "Prefix + Root + Suffix",
    def: "Loss of ability to understand or express speech.",
    breakdown: "<span>a-</span> = without • <span>phas</span> = speech • <span>-ia</span> = condition" },
  { cat: "prefix", term: "Antibiotic", sub: "Prefix + Root + Suffix",
    def: "A medication that kills or inhibits bacteria.",
    breakdown: "<span>anti-</span> = against • <span>biot</span> = life • <span>-ic</span> = pertaining to" },
  { cat: "prefix", term: "Anticoagulant", sub: "Prefix + Root + Suffix",
    def: "A substance that prevents blood clotting.",
    breakdown: "<span>anti-</span> = against • <span>coagul</span> = clotting • <span>-ant</span> = agent" },
  { cat: "prefix", term: "Antihypertensive", sub: "Prefix + Root + Suffix",
    def: "A medication that lowers blood pressure.",
    breakdown: "<span>anti-</span> = against • <span>hyper-</span> = high • <span>tens</span> = pressure • <span>-ive</span> = agent" },
  { cat: "prefix", term: "Antipyretic", sub: "Prefix + Root + Suffix",
    def: "A medication that reduces fever.",
    breakdown: "<span>anti-</span> = against • <span>pyret</span> = fever • <span>-ic</span> = pertaining to" },
  { cat: "prefix", term: "Antiseptic", sub: "Prefix + Root + Suffix",
    def: "A substance that inhibits the growth of microorganisms on living tissue.",
    breakdown: "<span>anti-</span> = against • <span>sept</span> = infection • <span>-ic</span> = pertaining to" },
  { cat: "prefix", term: "Antitussive", sub: "Prefix + Root + Suffix",
    def: "A medication that suppresses coughing.",
    breakdown: "<span>anti-</span> = against • <span>tuss</span> = cough • <span>-ive</span> = agent" },
  { cat: "prefix", term: "Bilateral", sub: "Prefix + Root + Suffix",
    def: "Relating to or affecting both sides of the body.",
    breakdown: "<span>bi-</span> = two • <span>later</span> = side • <span>-al</span> = pertaining to" },
  { cat: "prefix", term: "Unilateral", sub: "Prefix + Root + Suffix",
    def: "Relating to or affecting one side of the body.",
    breakdown: "<span>uni-</span> = one • <span>later</span> = side • <span>-al</span> = pertaining to" },
  { cat: "prefix", term: "Contralateral", sub: "Prefix + Root + Suffix",
    def: "Relating to the opposite side of the body.",
    breakdown: "<span>contra-</span> = opposite • <span>later</span> = side • <span>-al</span> = pertaining to" },
  { cat: "prefix", term: "Ipsilateral", sub: "Prefix + Root + Suffix",
    def: "Relating to the same side of the body.",
    breakdown: "<span>ipsi-</span> = same • <span>later</span> = side • <span>-al</span> = pertaining to" },
  { cat: "prefix", term: "Hypercapnia", sub: "Prefix + Root + Suffix",
    def: "Excessive carbon dioxide in the bloodstream.",
    breakdown: "<span>hyper-</span> = high • <span>capn</span> = carbon dioxide • <span>-ia</span> = condition" },
  { cat: "prefix", term: "Hypocapnia", sub: "Prefix + Root + Suffix",
    def: "Abnormally low carbon dioxide in the bloodstream.",
    breakdown: "<span>hypo-</span> = low • <span>capn</span> = carbon dioxide • <span>-ia</span> = condition" },
  { cat: "prefix", term: "Hyperkalemia", sub: "Prefix + Root + Suffix",
    def: "Abnormally high potassium in the blood.",
    breakdown: "<span>hyper-</span> = high • <span>kal</span> = potassium • <span>-emia</span> = blood condition" },
  { cat: "prefix", term: "Hypokalemia", sub: "Prefix + Root + Suffix",
    def: "Abnormally low potassium in the blood.",
    breakdown: "<span>hypo-</span> = low • <span>kal</span> = potassium • <span>-emia</span> = blood condition" },
  { cat: "prefix", term: "Hypothermia", sub: "Prefix + Root + Suffix",
    def: "Abnormally low body temperature.",
    breakdown: "<span>hypo-</span> = low • <span>therm</span> = heat • <span>-ia</span> = condition" },

  /* ============================================================
     SUFFIXES (50 cards)
     ============================================================ */
  { cat: "suffix", term: "Cardiology", sub: "Root + Suffix",
    def: "The study of the heart.",
    breakdown: "<span>cardi</span> = heart • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Neurology", sub: "Root + Suffix",
    def: "The study of the nervous system.",
    breakdown: "<span>neur</span> = nerve • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Hematology", sub: "Root + Suffix",
    def: "The study of blood, blood-forming organs, and blood diseases.",
    breakdown: "<span>hemat</span> = blood • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Pathology", sub: "Root + Suffix",
    def: "The study of disease — its causes, nature, and effects.",
    breakdown: "<span>path</span> = disease • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Radiology", sub: "Root + Suffix",
    def: "The study and use of medical imaging (X-rays, CT, MRI).",
    breakdown: "<span>radi</span> = radiation • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Oncology", sub: "Root + Suffix",
    def: "The study and treatment of tumors and cancer.",
    breakdown: "<span>onc</span> = tumor • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Pulmonology", sub: "Root + Suffix",
    def: "The study of the lungs and respiratory system.",
    breakdown: "<span>pulmon</span> = lung • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Nephrology", sub: "Root + Suffix",
    def: "The study of kidney function and kidney disease.",
    breakdown: "<span>nephr</span> = kidney • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Gastroenterology", sub: "Root + Root + Suffix",
    def: "The study of the stomach and intestines.",
    breakdown: "<span>gastr</span> = stomach • <span>enter</span> = intestine • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Endocrinology", sub: "Root + Root + Suffix",
    def: "The study of hormones and endocrine glands.",
    breakdown: "<span>endo-</span> = within • <span>crin</span> = secrete • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Anesthesiology", sub: "Prefix + Root + Suffix",
    def: "The branch of medicine dealing with anesthesia and pain management.",
    breakdown: "<span>an-</span> = without • <span>esthesia</span> = sensation • <span>-ology</span> = study of" },
  { cat: "suffix", term: "Dermatitis", sub: "Root + Suffix",
    def: "Inflammation of the skin.",
    breakdown: "<span>dermat</span> = skin • <span>-itis</span> = inflammation" },
  { cat: "suffix", term: "Gastritis", sub: "Root + Suffix",
    def: "Inflammation of the stomach lining.",
    breakdown: "<span>gastr</span> = stomach • <span>-itis</span> = inflammation" },
  { cat: "suffix", term: "Hepatitis", sub: "Root + Suffix",
    def: "Inflammation of the liver.",
    breakdown: "<span>hepat</span> = liver • <span>-itis</span> = inflammation" },
  { cat: "suffix", term: "Bronchitis", sub: "Root + Suffix",
    def: "Inflammation of the bronchial tubes.",
    breakdown: "<span>bronch</span> = bronchus • <span>-itis</span> = inflammation" },
  { cat: "suffix", term: "Peritonitis", sub: "Root + Suffix",
    def: "Inflammation of the peritoneum (abdominal lining).",
    breakdown: "<span>periton</span> = peritoneum • <span>-itis</span> = inflammation" },
  { cat: "suffix", term: "Meningitis", sub: "Root + Suffix",
    def: "Inflammation of the meninges (membranes around the brain and spinal cord).",
    breakdown: "<span>mening</span> = meninges • <span>-itis</span> = inflammation" },

/* ============================================================
   STORAGE — Persist progress across sessions
   ============================================================ */
const STORAGE_KEY = "terminology-decks-progress-v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { known: {}, review: {} };
    const parsed = JSON.parse(raw);
    return {
      known: parsed.known || {},
      review: parsed.review || {}
    };
  } catch (err) {
    console.warn("Could not load progress:", err);
    return { known: {}, review: {} };
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      known: Object.fromEntries([...known].map(k => [k, true])),
      review: Object.fromEntries([...review].map(k => [k, true]))
    }));
  } catch (err) {
    console.warn("Could not save progress:", err);
  }
}

/* ============================================================
   STATE
   ============================================================ */
let activeDeck = "all";
let deck = [...TERM_DECKS];
let index = 0;

const persisted = loadProgress();
let known = new Set(Object.keys(persisted.known));
let review = new Set(Object.keys(persisted.review));

let reviewOnlyMode = false;

/* ============================================================
   DOM
   ============================================================ */
const termCard = document.getElementById('termCard');
const termText = document.getElementById('termText');
const termSub = document.getElementById('termSub');
const termDef = document.getElementById('termDef');
const termBreakdown = document.getElementById('termBreakdown');
const termCardCounter = document.getElementById('termCardCounter');
const termProgressFill = document.getElementById('termProgressFill');
const termKnownCount = document.getElementById('termKnownCount');
const termReviewCount = document.getElementById('termReviewCount');
const termRemainingCount = document.getElementById('termRemainingCount');
const termDeckLabel = document.getElementById('termDeckLabel');
const cardReviewBadge = document.getElementById('cardReviewBadge');
const completionScreen = document.getElementById('completionScreen');
const completionMessage = document.getElementById('completionMessage');

/* ============================================================
   HELPERS
   ============================================================ */
function cardKey(card) {
  return `${card.cat}|${card.term}`;
}

function getFilteredDeck() {
  let base = activeDeck === "all"
    ? [...TERM_DECKS]
    : TERM_DECKS.filter(c => c.cat === activeDeck);

  if (reviewOnlyMode) {
    base = base.filter(c => review.has(cardKey(c)));
  } else {
    base = base.filter(c => !known.has(cardKey(c)));
  }

  return base;
}

function updateDeckTabBadges() {
  document.querySelectorAll('.deck-tab').forEach(tab => {
    const cat = tab.dataset.deck;
    let count;
    if (cat === "all") {
      count = TERM_DECKS.filter(c => review.has(cardKey(c))).length;
    } else {
      count = TERM_DECKS.filter(c => c.cat === cat && review.has(cardKey(c))).length;
    }

    const existing = tab.querySelector('.tab-badge');
    if (existing) existing.remove();

    if (count > 0) {
      const badge = document.createElement('span');
      badge.className = 'tab-badge';
      badge.textContent = count;
      tab.appendChild(badge);
    }
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function renderTermCard() {
  deck = getFilteredDeck();

  if (deck.length === 0) {
    showCompletionScreen();
    return;
  }

  hideCompletionScreen();

  if (index >= deck.length) index = 0;
  if (index < 0) index = deck.length - 1;

  const c = deck[index];
  termText.textContent = c.term;
  termSub.textContent = c.sub || '';
  termDef.textContent = c.def;
  termBreakdown.innerHTML = c.breakdown || '';

  termCard.classList.remove('flipped');

  if (review.has(cardKey(c))) {
    cardReviewBadge.style.display = 'block';
  } else {
    cardReviewBadge.style.display = 'none';
  }

  termCardCounter.textContent = `Card ${index + 1} of ${deck.length}`;
  termProgressFill.style.width = `${((index + 1) / deck.length) * 100}%`;

  termKnownCount.textContent = known.size;
  termReviewCount.textContent = review.size;
  termRemainingCount.textContent = deck.length;

  const labels = { all: "All Terms", prefix: "Prefixes", suffix: "Suffixes", root: "Root Words" };
  termDeckLabel.textContent = reviewOnlyMode
    ? "Review Mode — Still Learning"
    : (labels[activeDeck] || "All Terms");

  updateDeckTabBadges();
}

function showCompletionScreen() {
  termCard.classList.remove('flipped');
  document.body.classList.add('deck-finished');
  completionScreen.classList.add('visible');

  if (reviewOnlyMode) {
    completionMessage.textContent = "You've cleared your review list! Nothing is marked 'Still Learning' right now.";
    document.getElementById('reviewMissedFromCompleteBtn').style.display = 'none';
  } else if (review.size > 0) {
    completionMessage.textContent = `You've mastered this deck! You still have ${review.size} card${review.size === 1 ? '' : 's'} marked "Still Learning."`;
    document.getElementById('reviewMissedFromCompleteBtn').style.display = 'inline-block';
  } else {
    completionMessage.textContent = "You've mastered every card in this deck. Outstanding work!";
    document.getElementById('reviewMissedFromCompleteBtn').style.display = 'none';
  }

  termProgressFill.style.width = '100%';
  termKnownCount.textContent = known.size;
  termReviewCount.textContent = review.size;
  termRemainingCount.textContent = 0;
}

function hideCompletionScreen() {
  document.body.classList.remove('deck-finished');
  completionScreen.classList.remove('visible');
}

/* ============================================================
   DECK SWITCHING
   ============================================================ */
document.querySelectorAll('.deck-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.deck-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    activeDeck = tab.dataset.deck;
    reviewOnlyMode = false;
    index = 0;
    renderTermCard();
  });
});

/* ============================================================
   ACTIONS
   ============================================================ */
termCard.addEventListener('click', () => termCard.classList.toggle('flipped'));

document.getElementById('termNextBtn').addEventListener('click', () => {
  if (deck.length === 0) return;
  index = (index + 1) % deck.length;
  renderTermCard();
});

document.getElementById('termPrevBtn').addEventListener('click', () => {
  if (deck.length === 0) return;
  index = (index - 1 + deck.length) % deck.length;
  renderTermCard();
});

document.getElementById('termKnowBtn').addEventListener('click', () => {
  if (deck.length === 0) return;
  const c = deck[index];
  const key = cardKey(c);
  known.add(key);
  review.delete(key);
  saveProgress();

  deck.splice(index, 1);
  if (index >= deck.length) index = 0;
  renderTermCard();
});

document.getElementById('termReviewBtn').addEventListener('click', () => {
  if (deck.length === 0) return;
  const c = deck[index];
  const key = cardKey(c);
  review.add(key);
  known.delete(key);
  saveProgress();

  index = (index + 1) % deck.length;
  renderTermCard();
});

document.getElementById('termShuffleBtn').addEventListener('click', () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0;
  renderTermCard();
});

document.getElementById('termResetBtn').addEventListener('click', () => {
  if (!confirm("Reset progress for this deck? Cards marked 'Got It' will return to the rotation.")) return;
  const scope = activeDeck === "all"
    ? TERM_DECKS
    : TERM_DECKS.filter(c => c.cat === activeDeck);
  scope.forEach(c => {
    known.delete(cardKey(c));
    review.delete(cardKey(c));
  });
  saveProgress();
  index = 0;
  reviewOnlyMode = false;
  renderTermCard();
});

document.getElementById('reviewOnlyBtn').addEventListener('click', () => {
  reviewOnlyMode = !reviewOnlyMode;
  index = 0;
  if (reviewOnlyMode && review.size === 0) {
    alert("You haven't marked any cards as 'Still Learning' yet. Use the 'Still Learning' button to add some.");
    reviewOnlyMode = false;
  }
  renderTermCard();
});

document.getElementById('clearProgressBtn').addEventListener('click', () => {
  if (!confirm("Clear ALL progress? This will reset every deck. This cannot be undone.")) return;
  known.clear();
  review.clear();
  saveProgress();
  index = 0;
  reviewOnlyMode = false;
  renderTermCard();
});

document.getElementById('resetFromCompleteBtn').addEventListener('click', () => {
  document.getElementById('termResetBtn').click();
});

document.getElementById('reviewMissedFromCompleteBtn').addEventListener('click', () => {
  reviewOnlyMode = true;
  index = 0;
  renderTermCard();
});

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') document.getElementById('termNextBtn').click();
  if (e.key === 'ArrowLeft') document.getElementById('termPrevBtn').click();
  if (e.key === ' ') { e.preventDefault(); termCard.classList.toggle('flipped'); }
  if (e.key === '1') document.getElementById('termKnowBtn').click();
  if (e.key === '2') document.getElementById('termReviewBtn').click();
});

/* ============================================================
   INIT
   ============================================================ */
renderTermCard();
</script>
