<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminology Decks | Eric J's Field Notes</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="flashcard-study.css">
<style>
  :root {
    --bg: #fafafa;
    --deck-bg: #f3f1ec;
    --card-front: #a16207;
    --card-front-dark: #7a4a05;
    --card-back: #06402b;
    --card-back-dark: #042e1f;
    --accent: #a16207;
    --accent-dark: #7a4a05;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --correct: #06402b;
    --wrong: #ef4444;
    --review: #b45309;
    --shuffle: #06402b;
    --reset: #57534e;
    --breakdown-text: #fde68a;
    --border-soft: #d6d3d1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header.term-header {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  header.term-header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent);
  }

  header.term-header a.back-home-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    transition: all 0.15s ease;
  }

  header.term-header a.back-home-link:hover {
    background: var(--accent);
    color: #ffffff;
    transform: translateY(-1px);
  }

  .deck-selector {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .deck-tab {
    flex: 1;
    min-width: 120px;
    padding: 10px 16px;
    background: var(--deck-bg);
    color: var(--muted);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    position: relative;
  }

  .deck-tab:hover { color: var(--text); border-color: var(--accent); }
  .deck-tab.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .deck-tab .tab-badge {
    display: inline-block;
    background: var(--review);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .deck-tab.active .tab-badge {
    background: rgba(255, 255, 255, 0.3);
  }

  .term-progress-bar {
    width: 100%;
    max-width: 720px;
    height: 6px;
    background: var(--deck-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .term-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--correct));
    width: 0%;
    transition: width 0.3s ease;
  }

  .term-meta {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .term-card-container {
    perspective: 1200px;
    width: 100%;
    max-width: 720px;
    height: 400px;
    margin-bottom: 24px;
    cursor: pointer;
  }

  .term-card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .term-card.flipped { transform: rotateY(180deg); }

  .term-card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    color: #ffffff;
  }

  .term-card-front {
    background: linear-gradient(135deg, var(--card-front), var(--card-front-dark));
  }

  .term-card-back {
    background: linear-gradient(135deg, var(--card-back), var(--card-back-dark));
    transform: rotateY(180deg);
  }

  .term-card-review-badge {
    position: absolute;
    top: 16px;
    right: 20px;
    background: var(--review);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .term-card-label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.8;
  }

  .term-card-term {
    font-size: 2rem;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .term-card-sub {
    font-size: 0.95rem;
    opacity: 0.9;
    margin-top: 8px;
    font-style: italic;
  }

  .term-card-def {
    font-size: 1.35rem;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .term-card-breakdown {
    font-size: 0.95rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 12px 18px;
    border-radius: 10px;
    margin-top: 8px;
    line-height: 1.6;
    text-align: left;
    max-width: 90%;
  }

  .term-card-breakdown span { color: var(--breakdown-text); font-weight: 700; }

  .term-hint {
    position: absolute;
    bottom: 16px;
    font-size: 0.75rem;
    opacity: 0.7;
    letter-spacing: 0.5px;
  }

  .term-controls {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .term-controls button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    color: white;
  }

  .term-controls button:hover { transform: translateY(-1px); opacity: 0.92; }
  .term-controls button:active { transform: translateY(0); }
  .term-controls button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  .btn-nav { background: var(--reset); }
  .btn-know { background: var(--correct); }
  .btn-review { background: var(--review); }
  .btn-shuffle { background: var(--shuffle); }
  .btn-reset { background: var(--reset); }

  .term-stats {
    width: 100%;
    max-width: 720px;
    display: flex;
    justify-content: space-around;
    background: var(--deck-bg);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 16px;
    font-size: 0.9rem;
    margin-bottom: 16px;
  }

  .term-stat { text-align: center; }
  .term-stat .num { font-size: 1.4rem; font-weight: 700; display: block; }
  .term-stat .lbl { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

  .term-stat.known .num { color: var(--correct); }
  .term-stat.review .num { color: var(--review); }

  .term-secondary-controls {
    width: 100%;
    max-width: 720px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .term-secondary-controls button {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .term-secondary-controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .completion-screen {
    width: 100%;
    max-width: 720px;
    background: linear-gradient(135deg, var(--card-back), var(--card-back-dark));
    color: #ffffff;
    border-radius: 16px;
    padding: 60px 40px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    display: none;
    margin-bottom: 24px;
  }

  .completion-screen.visible { display: block; }

  .completion-screen .emoji { font-size: 4rem; margin-bottom: 16px; }
  .completion-screen h2 { font-size: 1.75rem; margin-bottom: 12px; }
  .completion-screen p { font-size: 1rem; opacity: 0.9; margin-bottom: 24px; line-height: 1.6; }

  .completion-screen button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #ffffff;
    cursor: pointer;
    margin: 4px;
    transition: all 0.15s ease;
  }

  .completion-screen button:hover { transform: translateY(-1px); opacity: 0.92; }

  .deck-finished .term-card-container,
  .deck-finished .term-controls,
  .deck-finished .term-progress-bar,
  .deck-finished .term-meta { display: none; }

  @media (max-width: 600px) {
    .term-card-term { font-size: 1.5rem; }
    .term-card-def { font-size: 1.1rem; }
    .term-card-container { height: 360px; }
    .term-card-face { padding: 28px 20px; }
    .deck-tab { font-size: 0.75rem; padding: 8px 10px; }
  }
</style>
</head>
<body>

<header class="term-header">
  <h1>📚 Terminology Decks</h1>
  <a href="index.html" class="back-home-link">
    <span class="material-icons" style="font-size: 1rem; vertical-align: middle;">arrow_back</span>
    Back to Home
  </a>
</header>

<div class="deck-selector" id="deckSelector">
  <button class="deck-tab active" data-deck="all">All Terms</button>
  <button class="deck-tab" data-deck="prefix">Prefixes</button>
  <button class="deck-tab" data-deck="suffix">Suffixes</button>
  <button class="deck-tab" data-deck="root">Root Words</button>
</div>

<div class="term-progress-bar"><div class="term-progress-fill" id="termProgressFill"></div></div>
<div class="term-meta">
  <span id="termCardCounter">Card 1 of 1</span>
  <span id="termDeckLabel">All Terms</span>
</div>

<div class="completion-screen" id="completionScreen">
  <div class="emoji">🎉</div>
  <h2>Deck Complete!</h2>
  <p id="completionMessage">You've mastered every card in this deck.</p>
  <button id="resetFromCompleteBtn">↻ Start Over</button>
  <button id="reviewMissedFromCompleteBtn" style="background: var(--review);">📚 Review Still Learning</button>
</div>

<div class="term-card-container" id="termCardContainer">
  <div class="term-card" id="termCard">
    <div class="term-card-face term-card-front">
      <div class="term-card-label">Term</div>
      <div class="term-card-review-badge" id="cardReviewBadge" style="display: none;">Still Learning</div>
      <div class="term-card-term" id="termText">—</div>
      <div class="term-card-sub" id="termSub"></div>
      <div class="term-hint">Tap card to flip</div>
    </div>
    <div class="term-card-face term-card-back">
      <div class="term-card-label">Meaning</div>
      <div class="term-card-def" id="termDef">—</div>
      <div class="term-card-breakdown" id="termBreakdown"></div>
      <div class="term-hint">Tap card to flip</div>
    </div>
  </div>
</div>

<div class="term-controls">
  <button class="btn-nav" id="termPrevBtn">◀ Prev</button>
  <button class="btn-review" id="termReviewBtn">Still Learning</button>
  <button class="btn-know" id="termKnowBtn">Got It ✓</button>
  <button class="btn-nav" id="termNextBtn">Next ▶</button>
</div>

<div class="term-controls">
  <button class="btn-shuffle" id="termShuffleBtn">🔀 Shuffle</button>
  <button class="btn-reset" id="termResetBtn">↻ Reset Deck</button>
</div>

<div class="term-secondary-controls">
  <button id="reviewOnlyBtn">📚 Review Only (Still Learning)</button>
  <button id="clearProgressBtn">🗑️ Clear All Progress</button>
</div>

<div class="term-stats">
  <div class="term-stat known">
    <span class="num" id="termKnownCount">0</span>
    <span class="lbl">Known</span>
  </div>
  <div class="term-stat review">
    <span class="num" id="termReviewCount">0</span>
    <span class="lbl">Still Learning</span>
  </div>
  <div class="term-stat">
    <span class="num" id="termRemainingCount">0</span>
    <span class="lbl">In Deck</span>
  </div>
</div>

<script src="terminology-data.js"></script>
<script src="card-catalog.js"></script>
<script src="flashcard-study.js"></script>
</body>
</html>
