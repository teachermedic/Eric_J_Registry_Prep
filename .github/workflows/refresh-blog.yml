name: Refresh latest blog preview
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-blog.yml'
      - 'scripts/refresh-blog.py'
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-blog-preview
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh snapshot
        run: python scripts/refresh-blog.py
      - name: Save changed preview
        run: |
          if ! git diff --quiet -- blog-posts.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add blog-posts.json
            git commit -m 'Refresh latest Substack preview'
            git push origin HEAD:main
          fi
      # Commits using GITHUB_TOKEN do not trigger branch-based Pages builds.
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
