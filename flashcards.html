<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Flashcards | Eric J's Field Notes</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ---------- LAYOUT OVERRIDES ---------- */
        body {
            padding: 16px 12px !important;
            display: block !important;
        }

        .fc-header {
            max-width: 720px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fc-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin: 0;
        }

        .fc-header a.back-home-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border: 1px solid var(--primary-blue);
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .fc-header a.back-home-link:hover {
            background: var(--primary-blue);
            color: #fff;
        }

        /* ---------- DECK SELECTOR ---------- */
        .deck-selector {
            max-width: 720px;
            margin: 0 auto 14px auto;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .deck-tab {
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            background: #f3f1ec;
            border: 1px solid #d6d3d1;
            font-size: 0.78rem;
            font-weight: 600;
            color: #6b6b6b;
            position: relative;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .deck-tab:hover { border-color: var(--primary-blue); color: var(--primary-blue); }
        .deck-tab.active {
            background: var(--primary-blue);
            color: #fff;
            border-color: var(--primary-blue);
        }

        .deck-tab .tab-badge {
            display: inline-block;
            background: #b45309;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 8px;
            margin-left: 5px;
        }

        .deck-tab.active .tab-badge {
            background: rgba(255, 255, 255, 0.35);
        }

        /* ---------- PROGRESS BAR ---------- */
        .fc-progress-bar {
            max-width: 720px;
            margin: 0 auto 6px auto;
            height: 5px;
            background: #e5e5e5;
            border-radius: 3px;
            overflow: hidden;
        }

        .fc-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-blue), #06402b);
            width: 0%;
            transition: width 0.3s ease;
        }

        .fc-meta {
            max-width: 720px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* ---------- CARD (with height fix) ---------- */
        .flashcard-wrapper {
            height: 360px !important;
            min-height: 360px !important;
            max-width: 720px !important;
            width: 100% !important;
            position: relative !important;
            perspective: 1200px !important;
            margin: 0 auto 20px auto !important;
            cursor: pointer;
        }

        .flashcard {
            width: 100% !important;
            height: 100% !important;
            position: relative !important;
            min-height: 360px !important;
            transform-style: preserve-3d !important;
            transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1) !important;
            border-radius: 15px !important;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15) !important;
        }

        .flashcard.is-flipped { transform: rotateY(180deg) !important; }

        .card-face {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 360px !important;
            padding: 25px !important;
            box-sizing: border-box !important;
            backface-visibility: hidden !important;
            border-radius: 15px !important;
            display: flex !important;
            flex-direction: column !important;
        }

        .card-front {
            background: linear-gradient(135deg, var(--primary-blue, #a16207), #7a4a05) !important;
            color: #fff !important;
            justify-content: center !important;
            align-items: center !important;
            text-align: center !important;
        }

        .card-back {
            background: linear-gradient(135deg, #06402b, #042e1f) !important;
            color: #fff !important;
            transform: rotateY(180deg) !important;
            justify-content: flex-start !important;
            align-items: flex-start !important;
            text-align: left !important;
            overflow-y: auto !important;
        }

        .card-icon {
            font-size: 2.5rem;
            color: rgba(255,255,255,0.85);
            margin-bottom: 8px;
        }

        .flip-hint {
            position: absolute;
            bottom: 12px;
            color: rgba(255,255,255,0.6);
            font-style: italic;
            font-size: 0.75rem;
            left: 50%;
            transform: translateX(-50%);
        }

        .card-back h4 {
            color: #fde68a;
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cheat-sheet-badge {
            margin-top: 12px;
            background: rgba(255,255,255,0.12);
            border-left: 4px solid #fde68a;
            padding: 10px;
            font-size: 0.82rem;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            color: #fff;
        }

        .card-review-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #b45309;
            color: #fff;
            font-size: 0.62rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ---------- CONTROLS ---------- */
        .fc-controls {
            max-width: 720px;
            margin: 0 auto 12px auto;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .fc-controls button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            color: #fff;
            flex: 1;
            min-width: 100px;
        }

        .fc-controls button:hover { transform: translateY(-1px); opacity: 0.92; }

        .btn-nav { background: #57534e; }
        .btn-know { background: #06402b; }
        .btn-review { background: #b45309; }

        /* ---------- SECONDARY CONTROLS ---------- */
        .fc-secondary-controls {
            max-width: 720px;
            margin: 0 auto 16px auto;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .fc-secondary-controls button {
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #d6d3d1;
            background: transparent;
            color: #6b6b6b;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .fc-secondary-controls button:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        /* ---------- STATS ---------- */
        .fc-stats {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            background: #f3f1ec;
            border: 1px solid #d6d3d1;
            border-radius: 12px;
            padding: 12px;
        }

        .fc-stats > div { text-align: center; }
        .fc-stats span {
            display: block;
            font-size: 1.35rem;
            font-weight: 700;
            color: #06402b;
        }
        .fc-stats small {
            font-size: 0.68rem;
            color: #6b6b6b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .fc-stats .stat-review span { color: #b45309; }

        /* ---------- COMPLETION SCREEN ---------- */
        .completion-screen {
            display: none;
            max-width: 720px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #06402b, #042e1f);
            color: #fff;
            padding: 50px 30px;
            border-radius: 15px;
            text-align: center;
        }

        .completion-screen.visible { display: block; }

        .completion-screen .emoji { font-size: 3rem; margin-bottom: 10px; }
        .completion-screen h2 { margin-bottom: 10px; font-size: 1.5rem; }
        .completion-screen p { opacity: 0.9; margin-bottom: 20px; font-size: 0.92rem; line-height: 1.5; }

        .completion-screen button {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            background: var(--primary-blue);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            margin: 4px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .completion-screen button:hover { opacity: 0.92; }

        /* Hide card UI when complete */
        .deck-finished .flashcard-wrapper,
        .deck-finished .fc-controls,
        .deck-finished .fc-secondary-controls,
        .deck-finished .fc-progress-bar,
        .deck-finished .fc-meta { display: none !important; }

        @media (max-width: 500px) {
            .flashcard-wrapper { height: 320px !important; min-height: 320px !important; }
            .card-face { min-height: 320px !important; }
            .fc-header h1 { font-size: 1rem; }
            .deck-tab { font-size: 0.7rem; padding: 5px 9px; }
        }
    </style>
</head>
<body>

<div class="fc-header">
    <h1>📇 Clinical Flashcards</h1>
    <a href="index.html" class="back-home-link">
        <span class="material-icons" style="font-size:1rem;">arrow_back</span>
        Back to Home
    </a>
</div>

<!-- Deck tabs -->
<div class="deck-selector" id="deckSelector"></div>

<!-- Progress bar -->
<div class="fc-progress-bar">
    <div class="fc-progress-fill" id="fcProgressFill"></div>
</div>
<div class="fc-meta">
    <span id="card-progress">Card 1 of 1</span>
    <span id="fcDeckLabel">All Cards</span>
</div>

<!-- Completion screen -->
<div class="completion-screen" id="completionScreen">
    <div class="emoji">🎉</div>
    <h2>Deck Complete!</h2>
    <p id="completionMessage">You've mastered every card in this deck.</p>
    <button id="resetFromCompleteBtn" type="button">↻ Start Over</button>
    <button id="reviewMissedFromCompleteBtn" type="button" style="background:#b45309;">📚 Review Still Learning</button>
</div>

<!-- Card -->
<div class="flashcard-wrapper" onclick="flipCard()">
    <div class="flashcard" id="main-card">
        <div class="card-face card-front">
            <div class="card-review-badge" id="cardReviewBadge" style="display:none;">Still Learning</div>
            <span class="material-icons card-icon" id="cardIcon">psychology</span>
            <p id="card-question-text" style="font-size:1.05rem; font-weight:500; margin: 0;"></p>
            <small class="flip-hint">Tap card to reveal clinical truth</small>
        </div>
        <div class="card-face card-back">
            <h4>Clinical Truth:</h4>
            <p id="card-answer-text" style="font-weight:bold; font-size:1.05rem; margin-bottom:10px;"></p>
            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.2); margin:8px 0; width:100%;">
            <p id="card-rationale-text" style="font-size:0.85rem; line-height:1.4;"></p>
            <div id="card-cheat-sheet" class="cheat-sheet-badge" style="display:none;"></div>
        </div>
    </div>
</div>

<!-- Primary controls -->
<div class="fc-controls">
    <button class="btn-nav" type="button" onclick="prevCard(event)">◀ Prev</button>
    <button class="btn-review" type="button" onclick="markReview(event)">Still Learning</button>
    <button class="btn-know" type="button" onclick="markKnown(event)">Got It ✓</button>
    <button class="btn-nav" type="button" onclick="nextCard(event)">Next ▶</button>
</div>

<!-- Secondary controls -->
<div class="fc-secondary-controls">
    <button type="button" onclick="shuffleDeck()">🔀 Shuffle</button>
    <button type="button" onclick="toggleReviewOnly()">📚 Review Only</button>
    <button type="button" onclick="resetCurrentDeck()">↻ Reset Deck</button>
    <button type="button" onclick="clearAllProgress()">🗑️ Clear All</button>
</div>

<!-- Stats -->
<div class="fc-stats">
    <div><span id="knownCount">0</span><small>Known</small></div>
    <div class="stat-review"><span id="reviewCount">0</span><small>Still Learning</small></div>
    <div><span id="remainingCount">0</span><small>In Deck</small></div>
</div>

<script src="flashcard_data.js"></script>
<script src="flashcards.js"></script>
</body>
</html>
