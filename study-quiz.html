<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Quiz | Eric J’s Hearth</title><meta name="description" content="Practice EMS study questions, check answers and explanations, and retry missed questions.">
<link rel="stylesheet" href="change-finding.css"><link rel="stylesheet" href="hearth-theme.css"><link rel="stylesheet" href="study-quiz.css"><link rel="icon" href="hearth-emblem.svg" type="image/svg+xml"></head>
<body class="hearth-site"><main class="challenge-shell">
<header><a href="index.html#study">← Study Hall</a><button id="quiz-theme" type="button">Toggle Theme</button></header>
<p class="brand">Eric J’s Hearth</p><h1>Study Quiz</h1><p>Recall an answer, check your work, and practice what you missed.</p>
<form id="quiz-setup" class="challenge-card"><label for="quiz-category">Category</label><select id="quiz-category"><option value="all">All categories</option></select>
<label for="quiz-size">Questions per round</label><select id="quiz-size"><option value="10">10</option><option value="20">20</option><option value="all">All available</option></select><p id="quiz-available" role="status"></p><button type="submit">Start Quiz</button></form>
<section id="quiz-round" class="challenge-card" hidden aria-labelledby="quiz-question"><p id="quiz-progress" role="status"></p><progress id="quiz-meter" aria-label="Questions completed"></progress><h2 id="quiz-question" tabindex="-1"></h2>
<form id="quiz-answer"><fieldset><legend id="quiz-instructions"></legend><div id="quiz-inputs"></div></fieldset><button id="quiz-check" type="submit">Check Answer</button><p id="quiz-error" role="alert"></p></form>
<section id="quiz-feedback" class="field-note" aria-live="polite" hidden><h3 id="quiz-verdict"></h3><p id="quiz-correct"></p><p id="quiz-rationale"></p></section><button id="quiz-next" type="button" hidden>Next Question</button></section>
<section id="quiz-results" class="challenge-card" hidden aria-labelledby="quiz-result-title"><h2 id="quiz-result-title" tabindex="-1">Round complete</h2><p id="quiz-score"></p><div id="quiz-review"></div><div class="quiz-actions"><button id="quiz-retry" type="button">Retry Missed Questions</button><button id="quiz-restart" type="button">Restart This Set</button></div></section>
<button id="quiz-new" type="button" hidden>Choose a New Quiz</button><p class="help">Scores apply to this round only. Quiz practice does not change exam scores or Know / Don’t Know flashcard progress. Reloading clears this session.</p>
<noscript><p>This interactive quiz requires JavaScript. <a href="index.html#study">Return to Study Hall</a>.</p></noscript></main><script src="flashcard_data.js"></script><script src="study-quiz-engine.js"></script><script src="study-quiz.js"></script></body></html>
